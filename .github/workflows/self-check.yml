name: Self-check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run deprecation auditor
        uses: ./scanner
        with:
          manifest-path: scanner/requirements.txt
          repo-root: .
