name: 'Deprecation Auditor'
description: 'Notifies when a commit uses deprecated dependencies (yanked/eol/new package/etc).'

inputs:
  manifest-path:
    description: 'Path to the requirements.txt being scanned'
    required: true
    default: 'requirements.txt'
  repo-root:
    description: 'Repo root directory'
    required: true
    default: '.'
  repo-info:
    description: 'Repository identifier'
    required: true
    default: ${{ github.repository }}
  github-token:
    description: 'Token used to read PR files and post PR comments'
    required: true
    default: ${{ github.token }}
  supabase-url:
    description: 'Supabase project URL used to check whether this repo is tracked on the dashboard'
    required: false
    default: 'https://kbgerqsshxfkhepkiyyl.supabase.co'
  supabase-pub-key:
    description: 'Supabase publishable key'
    required: false
    default: 'sb_publishable_K8ZOjX1yr9uwhXfEh5S1wg_db30r4lG'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - 'pypi_audit'
    - ${{ inputs.manifest-path }}
    - ${{ inputs.repo-root }}
    - ${{ inputs.repo-info }}
    - ${{ inputs.github-token }}
    - ${{ inputs.supabase-url }}
    - ${{ inputs.supabase-pub-key }}